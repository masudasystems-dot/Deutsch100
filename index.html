<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドイツ語基礎単語100（PDF完全準拠順・音声選択・連続再生付き）</title>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 20px; 
            color: #333; 
            background-color: #fcfcfc;
        }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .meta-info { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        
        /* コントロールパネル */
        .control-panel {
            background-color: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }
        .control-group { display: flex; align-items: center; gap: 8px; }
        label { font-size: 14px; font-weight: bold; color: #4a5568; }
        select, #search { 
            padding: 8px 12px; 
            font-size: 14px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            outline: none;
        }
        #search { width: 200px; }
        
        /* ボタン */
        .btn {
            cursor: pointer;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .btn-play-all { background-color: #2ecc71; color: white; }
        .btn-play-all:hover { background-color: #27ae60; }
        .btn-stop { background-color: #e74c3c; color: white; }
        .btn-stop:hover { background-color: #c0392b; }
        
        /* テーブル */
        .table-container { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eef2f3; }
        th { background-color: #34495e; color: white; font-weight: 600; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        
        /* 個別再生ボタン */
        .btn-sm {
            cursor: pointer;
            padding: 4px 8px;
            font-size: 12px;
            color: white;
            border: none;
            border-radius: 4px;
            margin-right: 4px;
        }
        .btn-sin { background-color: #3498db; }
        .btn-sin:hover { background-color: #2980b9; }
        .btn-plu { background-color: #9b59b6; }
        .btn-plu:hover { background-color: #8e44ad; }
        
        /* 再生中のハイライト */
        .highlight-row {
            background-color: #fff9db !important;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .no-plural { color: #bdc3c7; font-size: 13px; }
    </style>
</head>
<body>

    <h2>ドイツ語基礎単語100</h2>
    <p class="meta-info">PDFの列に沿った並び（上から下へ）に再調整しました。</p>

    <div class="control-panel">
        <div class="control-group">
            <label for="voiceSelect">🗣️ 声の種類:</label>
            <select id="voiceSelect" onchange="updateSelectedVoice()">
                <option value="">ブラウザの標準音声</option>
            </select>
        </div>
        
        <div class="control-group">
            <button class="btn btn-play-all" onclick="startPlayAll()">▶ 全て再生</button>
            <button class="btn btn-stop" onclick="stopPlayAll()">■ 停止</button>
        </div>

        <div class="control-group">
            <label for="search">🔍 検索:</label>
            <input type="text" id="search" placeholder="単語や意味で検索..." onkeyup="filterTable()">
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 50px;">No.</th>
                    <th style="width: 140px;">個別再生</th>
                    <th>単数形（性別）</th>
                    <th>複数形</th>
                    <th>日本語訳</th>
                </tr>
            </thead>
            <tbody id="wordTableBody">
                </tbody>
        </table>
    </div>

    <script>
        // PDFの1列目〜5列目の正確な順番に直したデータ
        const words = [
            // 【1列目：食事 〜 ワイン】
            { num: 1, singular: "das Essen", plural: "", kanji: "食事" },
            { num: 2, singular: "das Geschirr", plural: "", kanji: "食器" },
            { num: 3, singular: "das Gemüse", plural: "", kanji: "野菜" },
            { num: 4, singular: "das Obst", plural: "", kanji: "果物" },
            { num: 5, singular: "das Fleisch", plural: "", kanji: "肉" },
            { num: 6, singular: "der Fisch", plural: "", kanji: "魚" },
            { num: 7, singular: "das Brot", plural: "", kanji: "パン" },
            { num: 8, singular: "die Butter", plural: "", kanji: "バター" },
            { num: 9, singular: "die Suppe", plural: "", kanji: "スープ" },
            { num: 10, singular: "der Reis", plural: "", kanji: "米" },
            { num: 11, singular: "das Salz", plural: "", kanji: "塩" },
            { num: 12, singular: "der Zucker", plural: "", kanji: "砂糖" },
            { num: 13, singular: "der Käse", plural: "", kanji: "チーズ" },
            { num: 14, singular: "der Kuchen", plural: "", kanji: "ケーキ" },
            { num: 15, singular: "der Schinken", plural: "", kanji: "ハム" },
            { num: 16, singular: "die Wurst", plural: "", kanji: "ソーセージ" },
            { num: 17, singular: "der Salat", plural: "", kanji: "サラダ、レタス" },
            { num: 18, singular: "der Kohl", plural: "", kanji: "キャベツ" },
            { num: 19, singular: "das Wasser", plural: "", kanji: "水" },
            { num: 20, singular: "der Tee", plural: "", kanji: "(紅)茶" },
            { num: 21, singular: "der Kaffee", plural: "", kanji: "コーヒー" },
            { num: 22, singular: "die Milch", plural: "", kanji: "ミルク" },
            { num: 23, singular: "der Saft", plural: "", kanji: "ジュース" },
            { num: 24, singular: "das Bier", plural: "", kanji: "ビール" },
            { num: 25, singular: "der Wein", plural: "", kanji: "ワイン" },

            // 【2列目：卵 〜 フライパン】
            { num: 26, singular: "das Ei", plural: "die Eier", kanji: "卵" },
            { num: 27, singular: "die Kartoffel", plural: "die Kartoffeln", kanji: "ジャガイモ" },
            { num: 28, singular: "die Möhre", plural: "die Möhren", kanji: "ニンジン" },
            { num: 29, singular: "die Tomate", plural: "die Tomaten", kanji: "トマト" },
            { num: 30, singular: "die Zwiebel", plural: "die Zwiebeln", kanji: "タマネギ" },
            { num: 31, singular: "der Apfel", plural: "die Äpfel", kanji: "リンゴ" },
            { num: 32, singular: "die Banane", plural: "die Bananen", kanji: "バナナ" },
            { num: 33, singular: "die Birne", plural: "die Birnen", kanji: "洋ナシ" },
            { num: 34, singular: "die Traube", plural: "die Trauben", kanji: "ブドウ" },
            { num: 35, singular: "die Zitrone", plural: "die Zitronen", kanji: "レモン" },
            { num: 36, singular: "der Löffel", plural: "die Löffel", kanji: "スプーン" },
            { num: 37, singular: "die Gabel", plural: "die Gabeln", kanji: "フォーク" },
            { num: 38, singular: "das Messer", plural: "die Messer", kanji: "ナイフ" },
            { num: 39, singular: "der Teller", plural: "die Teller", kanji: "皿 (PDF: III)" },
            { num: 40, singular: "das Glas", plural: "die Gläser", kanji: "グラス" },
            { num: 41, singular: "die Tasse", plural: "die Tassen", kanji: "カップ" },
            { num: 42, singular: "die Flasche", plural: "die Flaschen", kanji: "ビン (PDF: ピン)" },
            { num: 43, singular: "der Topf", plural: "die Töpfe", kanji: "鍋" },
            { num: 44, singular: "die Pfanne", plural: "die Pfannen", kanji: "フライパン" },

            // 【3列目：ワンピース 〜 熊】
            { num: 45, singular: "das Kleid", plural: "die Kleider", kanji: "ワンピース" },
            { num: 46, singular: "der Rock", plural: "die Röcke", kanji: "スカート" },
            { num: 47, singular: "die Bluse", plural: "die Blusen", kanji: "ブラウス" },
            { num: 48, singular: "das Hemd", plural: "die Hemden", kanji: "シャツ" },
            { num: 49, singular: "die Hose", plural: "die Hosen", kanji: "ズボン" },
            { num: 50, singular: "der Gürtel", plural: "die Gürtel", kanji: "ベルト" },
            { num: 51, singular: "die Jacke", plural: "die Jacken", kanji: "ジャケット" },
            { num: 52, singular: "der Mantel", plural: "die Mäntel", kanji: "コート" },
            { num: 53, singular: "die Krawatte", plural: "die Krawatten", kanji: "ネクタイ" },
            { num: 54, singular: "der Hut", plural: "die Hüte", kanji: "帽子" },
            { num: 55, singular: "der Schuh", plural: "die Schuhe", kanji: "靴" },
            { num: 56, singular: "der Hund", plural: "die Hunde", kanji: "犬" },
            { num: 57, singular: "die Katze", plural: "die Katzen", kanji: "猫" },
            { num: 58, singular: "der Vogel", plural: "die Vögel", kanji: "鳥" },
            { num: 59, singular: "die Maus", plural: "die Mäuse", kanji: "ネズミ" },
            { num: 60, singular: "das Pferd", plural: "die Pferde", kanji: "馬" },
            { num: 61, singular: "der Bär", plural: "die Bären", kanji: "熊" },

            // 【4列目（2ページ目左）：頭 〜 足】
            { num: 62, singular: "der Kopf", plural: "die Köpfe", kanji: "頭" },
            { num: 63, singular: "das Haar", plural: "die Haare", kanji: "髪 (PDF: 髮)" },
            { num: 64, singular: "das Gesicht", plural: "die Gesichter", kanji: "顔 (PDF: 顏)" },
            { num: 65, singular: "das Auge", plural: "die Augen", kanji: "目" },
            { num: 66, singular: "die Nase", plural: "die Nasen", kanji: "鼻" },
            { num: 67, singular: "das Ohr", plural: "die Ohren", kanji: "耳" },
            { num: 68, singular: "der Mund", plural: "die Münder", kanji: "口 (PDF: Π)" },
            { num: 69, singular: "der Zahn", plural: "die Zähne", kanji: "歯" },
            { num: 70, singular: "der Hals", plural: "die Hälse", kanji: "首" },
            { num: 71, singular: "die Schulter", plural: "die Schultern", kanji: "肩" },
            { num: 72, singular: "der Arm", plural: "die Arme", kanji: "腕" },
            { num: 73, singular: "die Hand", plural: "die Hände", kanji: "手" },
            { num: 74, singular: "der Finger", plural: "die Finger", kanji: "指" },
            { num: 75, singular: "das Bein", plural: "die Beine", kanji: "脚" },
            { num: 76, singular: "der Fuß", plural: "die Füße", kanji: "足" },

            // 【5列目（2ページ目右）：学校 〜 本】
            { num: 77, singular: "die Schule", plural: "die Schulen", kanji: "学校" },
            { num: 78, singular: "die Universität", plural: "die Universitäten", kanji: "大学" },
            { num: 79, singular: "die Mensa", plural: "die Mensen", kanji: "学食" },
            { num: 80, singular: "das Restaurant", plural: "die Restaurants", kanji: "レストラン" },
            { num: 81, singular: "das Café", plural: "die Cafés", kanji: "カフェ" },
            { num: 82, singular: "der Supermarkt", plural: "die Supermärkte", kanji: "スーパー" },
            { num: 83, singular: "die Stadt", plural: "die Städte", kanji: "都市" },
            { num: 84, singular: "die Wohnung", plural: "die Wohnungen", kanji: "住まい" },
            { num: 85, singular: "das Haus", plural: "die Häuser", kanji: "家" },
            { num: 86, singular: "das Zimmer", plural: "die Zimmer", kanji: "部屋" },
            { num: 87, singular: "das Fenster", plural: "die Fenster", kanji: "窓" },
            { num: 88, singular: "die Tür", plural: "die Türen", kanji: "ドア" },
            { num: 89, singular: "die Küche", plural: "die Küchen", kanji: "台所" },
            { num: 90, singular: "die Toilette", plural: "die Toiletten", kanji: "トイレ" },
            { num: 91, singular: "die Dusche", plural: "die Duschen", kanji: "シャワー" },
            { num: 92, singular: "der Garten", plural: "die Gärten", kanji: "庭" },
            { num: 93, singular: "der Keller", plural: "die Keller", kanji: "地下室" },
            { num: 94, singular: "das Auto", plural: "die Autos", kanji: "自動車" },
            { num: 95, singular: "der Tisch", plural: "die Tische", kanji: "机" },
            { num: 96, singular: "der Stuhl", plural: "die Stühle", kanji: "椅子" },
            { num: 97, singular: "das Bett", plural: "die Betten", kanji: "ベッド" },
            { num: 98, singular: "das Regal", plural: "die Regale", kanji: "(本)棚" },
            { num: 99, singular: "der Schrank", plural: "die Schränke", kanji: "戸棚" },
            { num: 100, singular: "das Buch", plural: "die Bücher", kanji: "本" }
        ];

        let voices = [];
        let selectedVoice = null;
        let playQueue = [];
        let queueIndex = 0;
        let isPlayingAll = false;

        // テーブルの動的生成
        const tbody = document.getElementById('wordTableBody');
        words.forEach((word, index) => {
            const tr = document.createElement('tr');
            tr.id = `row-${index}`;
            
            const pluralBtn = word.plural ? `<button class="btn-sm btn-plu" onclick="speakSingle('${word.plural}')">複数 🔊</button>` : '';
            const pluralCell = word.plural ? word.plural : '<span class="no-plural">-</span>';

            tr.innerHTML = `
                <td>${word.num}</td>
                <td>
                    <button class="btn-sm btn-sin" onclick="speakSingle('${word.singular}')">単数 🔊</button>
                    ${pluralBtn}
                </td>
                <td>${word.singular}</td>
                <td>${pluralCell}</td>
                <td>${word.kanji}</td>
            `;
            tbody.appendChild(tr);
        });

        // 利用可能なドイツ語音声をロード
        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            
            voices = window.speechSynthesis.getVoices();
            const voiceSelect = document.getElementById('voiceSelect');
            voiceSelect.innerHTML = '';

            const deVoices = voices.filter(voice => voice.lang.toLowerCase().startsWith('de'));

            if (deVoices.length === 0) {
                const opt = document.createElement('option');
                opt.textContent = '標準ドイツ語音声 (ボイス選択不可)';
                voiceSelect.appendChild(opt);
                return;
            }

            deVoices.forEach((voice, idx) => {
                const opt = document.createElement('option');
                opt.value = voice.name;
                opt.textContent = `${voice.name} (${voice.lang})`;
                if (idx === 0) opt.selected = true;
                voiceSelect.appendChild(opt);
            });
            
            updateSelectedVoice();
        }

        function updateSelectedVoice() {
            const voiceSelect = document.getElementById('voiceSelect');
            selectedVoice = voices.find(voice => voice.name === voiceSelect.value) || null;
        }

        // 単発再生
        function speakSingle(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            if (selectedVoice) utterance.voice = selectedVoice;
            utterance.lang = 'de-DE';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }

        // 全て再生（連続再生）の開始
        function startPlayAll() {
            if (isPlayingAll) return;
            window.speechSynthesis.cancel();
            
            playQueue = [];
            words.forEach((word, index) => {
                const row = document.getElementById(`row-${index}`);
                if (row && row.style.display !== 'none') {
                    // 単数形を追加
                    playQueue.push({ text: word.singular, index: index });
                    // 複数形があれば続けて追加（単数 ➔ 複数の順）
                    if (word.plural) {
                        playQueue.push({ text: word.plural, index: index });
                    }
                }
            });

            if (playQueue.length === 0) return;
            queueIndex = 0;
            isPlayingAll = true;
            playNext();
        }

        // 連続再生の停止
        function stopPlayAll() {
            window.speechSynthesis.cancel();
            isPlayingAll = false;
            removeHighlights();
        }

        // 次の単語へ進む
        function playNext() {
            if (!isPlayingAll || queueIndex >= playQueue.length) {
                stopPlayAll();
                return;
            }

            const currentItem = playQueue[queueIndex];
            
            removeHighlights();
            const currentRow = document.getElementById(`row-${currentItem.index}`);
            if (currentRow) {
                currentRow.classList.add('highlight-row');
                currentRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            const utterance = new SpeechSynthesisUtterance(currentItem.text);
            if (selectedVoice) utterance.voice = selectedVoice;
            utterance.lang = 'de-DE';
            utterance.rate = 0.85;

            utterance.onend = function() {
                queueIndex++;
                setTimeout(playNext, 400); // 聴き取りやすいように単語の間に0.4秒の間隔
            };

            utterance.onerror = function() {
                stopPlayAll();
            };

            window.speechSynthesis.speak(utterance);
        }

        function removeHighlights() {
            document.querySelectorAll('#wordTableBody tr').forEach(tr => {
                tr.classList.remove('highlight-row');
            });
        }

        // 検索フィルター機能
        function filterTable() {
            const filter = document.getElementById('search').value.toLowerCase();
            words.forEach((word, index) => {
                const row = document.getElementById(`row-${index}`);
                if (!row) return;
                
                const matchSingular = word.singular.toLowerCase().includes(filter);
                const matchPlural = word.plural.toLowerCase().includes(filter);
                const matchKanji = word.kanji.toLowerCase().includes(filter);
                
                if (matchSingular || matchPlural || matchKanji) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        } else {
            alert('お使いのブラウザは音声再生機能に対応していません。最新のChromeやSafariをご利用ください。');
        }
    </script>
</body>
</html>
